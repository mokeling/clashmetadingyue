[custom]
; ==========================================================
; 个性化定制版（基于 new-meta.ini 修订）
; ----------------------------------------------------------
; 本次改动：
; 1. 删除不用应用：Notion / Netflix / TikTok / OKX / Binance /
;    Bybit / TeamViewer
; 2. Apple / Cloudflare / Microsoft 合并为「🛡️ 直连优先」（默认直连）
; 3. Steam 分流：商店/社区/创意工坊浏览走代理，游戏/模组下载走直连
; 4. 游戏平台拆分：中国游戏直连，海外游戏默认直连（可切代理）
; 5. PlayStation / Nintendo 独立分组（PS 默认直连、NS 默认香港）
; 6. Telegram / YouTube / Instagram / X / Discord 统一并入「💬 社交媒体」
; 7. 删除「📞 即时通讯」分组
; 8. 非标端口 / 兜底 / 测速组 保持原样
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 ---
ruleset=DIRECT,[]GEOSITE,google-cn

; --- 🎮 游戏分流 ---
; Steam：浏览（商店/社区/创意工坊/静态资源）走代理，下载走直连
ruleset=🎮 Steam,[]DOMAIN-SUFFIX,steampowered.com
ruleset=🎮 Steam,[]DOMAIN-SUFFIX,steamcommunity.com
ruleset=🎮 Steam,[]DOMAIN-SUFFIX,steam-chat.com
ruleset=🎮 Steam,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,steamcontent.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,steamusercontent.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,steamcdn-a.akamaihd.net

; PlayStation / Nintendo 独立分组
ruleset=🎮 PlayStation,[]GEOSITE,playstation
ruleset=🎮 Nintendo,[]GEOSITE,nintendo

; 中国游戏平台直连
ruleset=DIRECT,[]GEOSITE,category-games-cn

; 海外游戏平台（默认直连，可切代理）
ruleset=🎮 海外游戏,[]GEOSITE,category-games-!cn

; BT 下载直连
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 核心应用 ---
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest

; --- 社交媒体（统一出口）---
ruleset=💬 社交媒体,[]GEOSITE,telegram
ruleset=💬 社交媒体,[]GEOSITE,youtube
ruleset=💬 社交媒体,[]GEOSITE,discord
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; --- 直连优先（部分能直连、偶尔需代理）---
ruleset=🛡️ 直连优先,[]GEOSITE,apple
ruleset=🛡️ 直连优先,[]GEOSITE,cloudflare
ruleset=🛡️ 直连优先,[]GEOSITE,microsoft

; --- Google ---
ruleset=🔎 Google,[]GEOSITE,google

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组
; ==========================================================
custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

; 🎮 Steam：默认香港代理（网页用），可切其他
custom_proxy_group=🎮 Steam`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; 🎮 PlayStation：默认直连，可切代理
custom_proxy_group=🎮 PlayStation`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

; 🎮 Nintendo：默认香港，可切其他
custom_proxy_group=🎮 Nintendo`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; 🎮 海外游戏：默认直连（下载快），可切代理
custom_proxy_group=🎮 海外游戏`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

; 💬 社交媒体：默认香港代理
custom_proxy_group=💬 社交媒体`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

; 🛡️ 直连优先：默认直连，可切代理
; 想新增应用：在上面规则区加一行 ruleset=🛡️ 直连优先,[]GEOSITE,分类名
custom_proxy_group=🛡️ 直连优先`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]🌐 Default

; 🟥 Adobe：可一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]♻️ 自动选择`[]DIRECT`[]REJECT`[]🌐 Default


; ==========================================================
; 3) Default / 漏网之鱼
; ==========================================================
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]DIRECT

custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 全部节点`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🚀 手动选择


; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 国家节点测速组（保持不动）
; ==========================================================
custom_proxy_group=🧭 全部节点`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://cp.cloudflare.com/generate_204`300,300
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
